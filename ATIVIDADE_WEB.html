<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="form-container">
        <h2>Inscreva-se no nosso Blog</h2>
        <p>Receba nossos conteúdos diretamente no seu e-mail.</p>

        <form>
            <!-- Bônus: Nome e E-mail lado a lado -->
            <div class="row-group">
                <div class="input-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Seu nome completo">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com">
                </div>
            </div>

            <div class="input-group">
                <label for="assunto">Assunto de interesse</label>
                <select id="assunto">
                    <option value="">Selecione uma categoria</option>
                    <option value="dev">Desenvolvimento Web</option>
                    <option value="design">UI/UX Design</option>
                    <option value="carreira">Carreira Tech</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Cadastrar</button>
        </form>
    </main>

</body>
</html>
